v<!DOCTYPE html>
<html>
    <body>
        <h2>Penggunaan Unordered di HTML</h2>

        <ul>
            <li>Coffe</li>
            <li>Tea</li>
            <li>Milk</li>
        </ul>

        <h2>Penggunaan ordered di HTML</h2>

        <ol>
            <li>Coffe</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
